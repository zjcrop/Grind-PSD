name: Ingest PSD Result

on:
  issues:
    types:
      - opened
      - edited
      - reopened
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number containing a Grind-PSD JSON payload
        required: false

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    if: startsWith(github.event.issue.title, '[PSD]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and validate record
        env:
          EVENT_PATH: ${{ github.event_path }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/ingest_psd_result.py

      - name: Commit database update
        run: |
          if [ -z "$(git status --porcelain -- data/database.json data/users)" ]; then
            echo "No database changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/database.json data/users
          git commit -m "Add Grind-PSD community result"
          git push

      - name: Comment success
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "Grind-PSD record validated and queued into data/database.json."
