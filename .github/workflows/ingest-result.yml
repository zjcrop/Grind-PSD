name: Validate and ingest PSD result

on:
  issues:
    types:
      - opened
      - edited
      - reopened
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing Issue number containing a Grind-PSD payload
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: grind-psd-database-ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[PSD]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ingestion script syntax
        run: |
          python3 -m py_compile .github/scripts/ingest_psd_result.py
          python3 -m unittest discover -s tests -v

      - name: Extract, validate and normalize record
        id: ingest
        continue-on-error: true
        env:
          EVENT_PATH: ${{ github.event_path }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          INGEST_ERROR_PATH: /tmp/grind-psd-ingest-error.txt
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ingest_psd_result.py

      - name: Report rejected record
        if: steps.ingest.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          message="$(tr '\n' ' ' < /tmp/grind-psd-ingest-error.txt | cut -c1-500)"
          gh issue comment "$ISSUE_NUMBER" --body "❌ Grind-PSD 数据校验未通过：${message}"
          exit 1

      - name: Commit database update
        if: steps.ingest.outcome == 'success' && steps.ingest.outputs.duplicate != 'true'
        run: |
          if [ -z "$(git status --porcelain -- data/database.json data/users)" ]; then
            echo "No database changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/database.json data/users
          git commit -m "data: add PSD result ${{ steps.ingest.outputs.record_id }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Confirm accepted record
        if: steps.ingest.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          RECORD_ID: ${{ steps.ingest.outputs.record_id }}
          USER_ID: ${{ steps.ingest.outputs.user_id }}
          DUPLICATE: ${{ steps.ingest.outputs.duplicate }}
        run: |
          if [ "$DUPLICATE" = "true" ]; then
            message="✅ 该记录已存在，无需重复写入：\`${RECORD_ID}\`。"
          else
            message="✅ 数据已通过校验并写入总库及 \`data/users/${USER_ID}.json\`：\`${RECORD_ID}\`。"
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$message"
          gh issue close "$ISSUE_NUMBER" --reason completed
