name: Apply Grind-PSD v1.4 permission model

on:
  push:
    branches:
      - feature/account-cloud-permissions-v1-4
    paths:
      - tools/apply_v1_4_permissions.py
      - .github/workflows/apply-v1-4-permissions.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/account-cloud-permissions-v1-4

      - name: Apply repository patches
        run: python3 tools/apply_v1_4_permissions.py

      - name: Validate JavaScript and tests
        run: |
          node --check assets/psd-core.js
          node --check assets/supabase-sync-v7.2.2.js
          node --check assets/app-v7.js
          node --check assets/record-policy-core-v1.4.js
          node --check assets/permissions-v1.4.js
          node tests/test_core.js
          node tests/test_mobile_io.js
          node tests/test_cloud_sync.js
          node tests/test_permissions_v14.js
          python3 -m json.tool manifest.webmanifest > /dev/null
          python3 -m json.tool data/record.schema.json > /dev/null
          python3 -m unittest discover -s tests -v

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/app-v7.js service-worker.js manifest.webmanifest README.md .github/workflows/pages.yml tests/test_static_ui.py
          if git diff --cached --quiet; then
            echo "Generated files are already current."
          else
            git commit -m "Implement local-first permissions and aligned PSD comparison"
            git push origin HEAD:feature/account-cloud-permissions-v1-4
          fi
