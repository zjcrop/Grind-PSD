name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-1.0
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle -p mobile/android :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk Grind-PSD-Android-1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Grind-PSD-Android-1.0-APK
          path: Grind-PSD-Android-1.0.apk
          if-no-files-found: error
