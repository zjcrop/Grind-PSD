name: Patch v1.7 static assertions

on:
  push:
    branches:
      - feature/owner-edit-entry-v1-7

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/owner-edit-entry-v1-7
          fetch-depth: 0

      - name: Update exact stale assertions
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("tests/test_static_ui.py")
          text = path.read_text(encoding="utf-8")
          old_shell = "grind-psd-shell-v1.4.0"
          old_manifest = '\"version\": \"1.4.0\"'
          if text.count(old_shell) != 2:
              raise SystemExit(f"Expected 2 old shell assertions, found {text.count(old_shell)}")
          if text.count(old_manifest) != 1:
              raise SystemExit(f"Expected 1 old manifest assertion, found {text.count(old_manifest)}")
          text = text.replace(old_shell, "grind-psd-shell-v1.7.0")
          text = text.replace(old_manifest, '\"version\": \"1.7.0\"')
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/patch-v17-static-tests.yml

      - name: Commit focused assertion update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_static_ui.py .github/workflows/patch-v17-static-tests.yml
          git commit -m "test: update static assertions for v1.7"
          git push origin HEAD:feature/owner-edit-entry-v1-7
